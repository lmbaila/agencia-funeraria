services:
  postgres:
    image: postgres:16-alpine
    container_name: afunes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afunes
      POSTGRES_PASSWORD: afunes
      POSTGRES_DB: afunes
    volumes:
      - afunes_pgdata:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afunes']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: afunes-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://afunes:afunes@postgres:5432/afunes?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production}
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ADMIN_IDENTIFIER: ${ADMIN_IDENTIFIER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      MOBILE_MONEY_SIMULATED_DELAY_MS: 2500
      MOBILE_MONEY_SUCCESS_RATE: 0.9
    volumes:
      - afunes_uploads:/app/uploads
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: afunes-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  afunes_pgdata:
  afunes_uploads:
